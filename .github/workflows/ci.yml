name: CALLFORGE — Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/m1-voice-prototype]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: callforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_and_build:
    name: Flutter quality and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --coverage
      - name: Compile Android debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: callforge-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  android_emulator_integration:
    name: Android API 34 hosted emulator (mocked speech)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Enable KVM access for hosted Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android integration tests (STT/TTS mocked)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            flutter devices
            flutter test integration_test/app_test.dart -d emulator-5554 --reporter expanded
